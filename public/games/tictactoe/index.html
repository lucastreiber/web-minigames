<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="tictactoe.css">
</head>
<body>
    <header>
        <a href="../../index.html">
            <img src="../../assets/logo.webp" alt="Accueil">
        </a>
        <h1>MORPION</h1>
    </header>
    <main>
        <aside>

        </aside>
        <div class="tictactoe">
            <img class="cell" id="0" />
            <img class="cell" id="1" />
            <img class="cell" id="2" />
            <img class="cell" id="3" />
            <img class="cell" id="4" />
            <img class="cell" id="5" />
            <img class="cell" id="6" />
            <img class="cell" id="7" />
            <img class="cell" id="8" />
        </div>
        <div id="modal-victory">
            <div class="modal-content">
                <h2 id="texte-victory">Joueur ? a gagné !</h2>
                <button id="replay">Rejouer</button>
            </div>
        </div>
    </main>
    <script src="tictactoe.js"></script>
</body>
</html>
